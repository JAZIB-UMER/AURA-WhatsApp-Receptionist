# AURA dashboard theme — always light, with a violet brand accent (inspired by ClickUp's clean look).
# Only [theme] and [theme.sidebar] are set (no [theme.light]/[theme.dark]), which locks the
# appearance: the dashboard stays light even when the browser or Windows uses dark mode.
# Status colours used everywhere: orange = awaiting reply, green = confirmed / done,
# red = cancelled / delete, blue = rescheduled / info.

[theme]
base = "light"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "0.5rem"
paddingBottom = "3rem"

primaryColor = "#7B68EE"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F5FF"
codeBackgroundColor = "#F3F2FB"
textColor = "#1F2433"
linkColor = "#6A57E3"
borderColor = "#E3E1F0"
codeTextColor = "#3B3F52"
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
blueColor = "#2563EB"
violetColor = "#7B68EE"
grayColor = "#6B7280"
chartCategoricalColors = ["#7B68EE", "#10B981", "#F59E0B", "#EF4444", "#3B82F6", "#EC4899", "#14B8A6", "#6B7280"]
chartSequentialColors = ["#F5F3FF", "#EDE9FE", "#DDD6FE", "#C4B5FD", "#A78BFA",
                         "#8B5CF6", "#7C3AED", "#6D28D9", "#5B21B6", "#4C1D95"]
dataframeBorderColor = "#E3E1F0"
dataframeHeaderBackgroundColor = "#F3F1FD"
dataframeHeaderTextColor = "#1F2433"

[theme.sidebar]
paddingTop = "0.5rem"
paddingBottom = "1.5rem"
backgroundColor = "#F8F7FD"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EEEBFB"
textColor = "#1F2433"
borderColor = "#E3E1F0"
primaryColor = "#7B68EE"
linkColor = "#6A57E3"

[client]
toolbarMode = "minimal"
